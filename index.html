<title>健身助手</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FFFFFF;--bg2:#F5F5F5;
  --text:#111111;--text2:#666666;--text3:#999999;
  --accent:#000000;--border:#E5E5E5;
  --success:#00C853;--warning:#FF9800;
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
}
html{font-size:16px}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

/* Header */
.app-header{
  position:sticky;top:0;z-index:100;
  padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.app-header h1{font-size:1.15rem;font-weight:700;letter-spacing:-0.3px}
.header-streak{display:flex;align-items:center;gap:5px;font-size:0.85rem;font-weight:600}
.header-streak .flame{font-size:1.1rem;animation:flamePulse 0.8s ease-in-out infinite alternate}
@keyframes flamePulse{0%{transform:scale(1)}100%{transform:scale(1.25);filter:drop-shadow(0 0 6px #FF9800)}}

/* Navigation */
.nav-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 12px;border:none;background:none;
  color:var(--text3);cursor:pointer;transition:all 0.15s;
  font-size:0.65rem;font-weight:500;font-family:inherit;
}
.nav-item .nav-icon{font-size:1.25rem;transition:transform 0.15s}
.nav-item:active{transform:scale(0.94)}
.nav-item.active{color:var(--accent);font-weight:700}
.nav-item.active .nav-icon{transform:scale(1.1)}

/* Pages */
.page-container{padding-bottom:80px}
.page{display:none;padding:0 16px;animation:pageIn 0.28s cubic-bezier(0.22,0.61,0.36,1)}
.page.active{display:block}
@keyframes pageIn{0%{opacity:0;transform:translateX(24px)}100%{opacity:1;transform:translateX(0)}}

/* Section Title */
.section-title{
  font-size:1.25rem;font-weight:700;letter-spacing:-0.3px;
  margin:20px 0 12px;display:flex;align-items:center;gap:8px;
}
.section-title-sm{font-size:1rem;font-weight:700;margin:16px 0 8px}

/* Card */
.card{
  background:var(--bg);border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  padding:16px;margin-bottom:12px;
  transition:transform 0.15s,box-shadow 0.15s;
}
.card:active{transform:scale(0.985);box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.card-flush{padding:0;overflow:hidden}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:14px 24px;border-radius:var(--radius-sm);border:none;
  font-size:0.95rem;font-weight:700;font-family:inherit;
  cursor:pointer;transition:all 0.15s;letter-spacing:0.1px;
}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-secondary{background:var(--bg);color:var(--accent);border:2px solid var(--accent)}.btn-icon-sm{background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}.btn-icon-sm:hover{background:var(--border);color:var(--text1)}.btn-icon-sm:active{transform:scale(.92)}
.btn-sm{padding:8px 16px;font-size:0.8rem;width:auto}
.btn-block{width:100%}

/* Chips */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 18px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text2);font-size:0.83rem;font-weight:500;
  cursor:pointer;transition:all 0.15s;font-family:inherit;white-space:nowrap;
}
.chip:active{transform:scale(0.95)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* Input */
input,textarea,select{
  width:100%;padding:12px 14px;border-radius:var(--radius-xs);
  border:1.5px solid var(--border);background:var(--bg2);
  color:var(--text);font-size:0.92rem;font-family:inherit;
  outline:none;transition:border-color 0.15s;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--bg)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:0.8rem;color:var(--text2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

/* Home - Greeting */
.greeting{font-size:1.75rem;font-weight:700;letter-spacing:-0.5px;line-height:1.2}
.greeting-sub{font-size:0.92rem;color:var(--text2);margin-top:4px}

/* Home - Body Part Grid */
.part-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part-card{
  background:var(--bg);border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  padding:20px 16px;cursor:pointer;transition:all 0.15s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-align:center;border:2px solid transparent;
}
.part-card:active{transform:scale(0.96);box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.part-card .part-emoji{font-size:2.4rem}
.part-card .part-name{font-weight:700;font-size:0.95rem}
.part-card .part-count{font-size:0.72rem;color:var(--text3)}

/* Exercise List */
.exercise-item{
  display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--border);cursor:pointer;
  transition:background 0.1s;
}
.exercise-item:active{background:var(--bg2);margin:0 -16px;padding-left:16px;padding-right:16px}
.exercise-thumb{
  width:52px;height:52px;border-radius:var(--radius-xs);
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;flex-shrink:0;
}
.exercise-info{flex:1;min-width:0}
.exercise-name{font-weight:700;font-size:0.93rem}
.exercise-name-en{font-size:0.73rem;color:var(--text3)}
.exercise-meta{display:flex;gap:6px;margin-top:3px}
.tag{
  font-size:0.68rem;padding:2px 8px;border-radius:4px;
  background:var(--bg2);color:var(--text2);font-weight:500;
}

/* Exercise Detail */
.exercise-detail{display:none;background:var(--bg)}
.exercise-detail.open{display:block}
.exercise-detail-img{
  width:100%;height:220px;object-fit:cover;
  background:var(--bg2);border-radius:0;
}
.detail-card{
  background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;
  margin-top:-16px;position:relative;z-index:1;
  padding:20px 16px;box-shadow:0 -4px 20px rgba(0,0,0,0.06);
}
.detail-title{font-size:1.4rem;font-weight:700;letter-spacing:-0.3px}
.detail-subtitle{font-size:0.85rem;color:var(--text3);margin-bottom:16px}
.detail-section{margin-bottom:14px}
.detail-section h4{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.detail-section p,.detail-section li{font-size:0.88rem;color:var(--text2);line-height:1.55}
.detail-section ul,.detail-section ol{padding-left:18px}
.detail-section li{margin-bottom:3px}

/* Training Set Row */
.set-row{
  display:grid;grid-template-columns:40px 1fr 1fr 36px;
  gap:8px;align-items:center;margin-bottom:8px;
  padding:6px 0;border-bottom:1px solid var(--bg2);
}
.set-row .set-num{font-size:0.75rem;color:var(--text3);font-weight:600;text-align:center}
.set-row input{text-align:center;padding:10px 4px;font-size:0.9rem;font-weight:500}
.set-done{

  background:var(--bg);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:0.8rem;transition:all 0.15s;
}
.set-done.done{background:var(--success);border-color:var(--success);color:#fff}

/* Timer Overlay */
.timer-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  justify-content:center;align-items:center;flex-direction:column
}
.timer-overlay.show{display:flex}
.timer-ring{
  width:180px;height:180px;border-radius:50%;
  border:4px solid var(--accent);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-bottom:24px;
}
.timer-time{font-size:3.2rem;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.timer-label{font-size:0.78rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.timer-btns{display:flex;gap:8px;margin-bottom:16px}
.timer-btns .chip{padding:10px 18px;border-radius:24px}

/* PR Badge */
.pr-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:6px;
  background:var(--success);color:#fff;
  font-size:0.72rem;font-weight:700;
  animation:prPulse 1.2s ease infinite alternate;
}
@keyframes prPulse{0%{box-shadow:0 0 4px rgba(0,200,83,0.4)}100%{box-shadow:0 0 16px rgba(0,200,83,0.7),0 0 32px rgba(0,200,83,0.3)}}

/* Confetti */
#confetti-canvas{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}

/* Calendar Heatmap */
.heatmap-wrap{overflow-x:auto;padding:4px 0}
.heatmap-grid{display:flex;gap:3px;flex-wrap:wrap;min-width:fit-content}
.heatmap-cell{
  width:14px;height:14px;border-radius:3px;
  background:var(--bg2)
}
.heatmap-cell.l1{background:#C8E6C9}
.heatmap-cell.l2{background:#66BB6A}
.heatmap-cell.l3{background:#2E7D32}
.heatmap-cell.l4{background:#1B5E20}

/* Achievements */
.achieve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.achieve-item{
  text-align:center;padding:16px 8px;border-radius:var(--radius);
  background:var(--bg);border:1.5px solid var(--border);
  transition:all 0.2s;
}
.achieve-item.unlocked{border-color:var(--success);background:#F1F8E9}
.achieve-icon{font-size:2rem;margin-bottom:4px}
.achieve-item.unlocked .achieve-icon{animation:achieveBounce 0.6s ease}
.achieve-name{font-size:0.7rem;font-weight:600;line-height:1.2}
.achieve-item:not(.unlocked) .achieve-icon{filter:grayscale(1);opacity:0.35}
.achieve-item:not(.unlocked) .achieve-name{color:var(--text3)}
@keyframes achieveBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* Progress Bar */
.progress-wrap{
  background:var(--bg2);border-radius:6px;height:8px;
  overflow:hidden;margin:8px 0;
}
.progress-fill{
  height:100%;border-radius:6px;background:var(--accent);
  transition:width 0.5s cubic-bezier(0.22,0.61,0.36,1);
}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{
  background:var(--bg);border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  padding:18px 16px;text-align:center;
}
.stat-value{font-size:2rem;font-weight:700;letter-spacing:-1px}
.stat-label{font-size:0.73rem;color:var(--text3);margin-top:2px;font-weight:500}

/* History */
.history-item{margin-bottom:6px}
.history-header{
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;padding:12px 0;
}
.history-date{font-weight:600;font-size:0.9rem}
.history-body{font-size:0.78rem;color:var(--text2)}
.history-detail{display:none;padding:0 0 12px;font-size:0.83rem;color:var(--text2)}
.history-detail.open{display:block}

/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap .search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:1rem;color:var(--text3);z-index:2;
}
.search-wrap input{padding-left:42px;background:var(--bg2);border-radius:var(--radius-sm)}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:150;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  justify-content:center;align-items:flex-end;padding:0;
}
.modal-overlay.show{display:flex}
.modal-content{
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:24px 20px;width:100%;max-height:75vh;
  overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,0.15);
  animation:slideUp 0.25s cubic-bezier(0.22,0.61,0.36,1);
}
@keyframes slideUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-content h3{font-size:1.15rem;font-weight:700;margin-bottom:12px}

/* Toast */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:400;
  padding:12px 24px;border-radius:24px;background:var(--accent);color:#fff;
  font-weight:600;font-size:0.88rem;opacity:0;transition:opacity 0.3s;
  pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.2);
}
.toast.show{opacity:1}

/* Empty State */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:10px}

/* Back button */
.back-btn{
  display:flex;align-items:center;gap:6px;background:none;border:none;
  font-size:0.9rem;font-weight:600;font-family:inherit;cursor:pointer;
  color:var(--accent);padding:8px 0;margin-bottom:8px;
}

/* Misc */
.hidden{display:none!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

.flex-between{display:flex;justify-content:space-between;align-items:center}

</style>
</head>

// ============ DATA LAYER ============
const STORAGE = {

// ============ HELPERS ============
function getWeeklyCount() {
  const logs = getLogs();
  const now = new Date();
  const dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - (dow===0?6:dow-1)); mon.setHours(0,0,0,0);
  const days = new Set();
  logs.forEach(l => { const d = new Date(l.date); if(d>=mon) days.add(d.toISOString().split('T')[0]); });
  return days.size;
}
function getWeekLogs() {
  const logs = getLogs();
  const now = new Date();
  const dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - (dow===0?6:dow-1)); mon.setHours(0,0,0,0);
  return logs.filter(l => new Date(l.date) >= mon);
}

// ============ STREAK ============
function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  const s = getStreak();
  if (s.lastDate === today) return;
  const yest = new Date(Date.now()-86400000).toISOString().split('T')[0];
  if (s.lastDate === yest) s.current++;
  else if (s.lastDate !== today) s.current = 1;
  if (s.current > s.longest) s.longest = s.current;
  s.lastDate = today;
  saveStreak(s);
  updateStreakUI();
}
function updateStreakUI() {
  const s = getStreak();
  document.getElementById('streakCount').textContent = s.current;
}

// ============ ACHIEVEMENT CHECK ============
function checkAchievements(prs) {
  const unlocked = getAchievements();
  const logs = getLogs();
  const streak = getStreak();
  let added = [];

  const tryUnlock = (id) => { if (!unlocked.includes(id)) { unlocked.push(id); added.push(id); } };

  if (logs.length >= 1) tryUnlock('first-workout');
  if (logs.length >= 100) tryUnlock('100-workouts');
  if (streak.current >= 2) tryUnlock('streak-2');
  if (streak.current >= 30) tryUnlock('streak-30');

  const allParts = new Set(); logs.forEach(l => l.bodyParts.forEach(p => allParts.add(p)));
  if (BODY_PARTS.every(p => allParts.has(p))) tryUnlock('balanced');

  if (prs && prs.length > 0) tryUnlock('pr-breaker');
  if (getWeeklyCount() >= 3) tryUnlock('weekly-3');

  if (added.length > 0) {
    saveAchievements(unlocked);
    added.forEach(id => {
      const a = ACHIEVEMENTS.find(x => x.id === id);
      if (a) showToast(`🏆 ${a.icon} ${a.name}`);
    });
  }
}

// ============ CONFETTI ============
function triggerConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  const particles = [];
  const colors = ['#00C853','#000000','#FF9800','#FFEB3B','#FFF','#2196F3'];
  for (let i=0;i<120;i++) {
    particles.push({
      x: Math.random()*canvas.width, y: -20-Math.random()*canvas.height,
      w: 6+Math.random()*8, h: 4+Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5)*3, vy: 3+Math.random()*6,
      rot: Math.random()*360, rotV: (Math.random()-0.5)*10, opacity:1
    });
  }
  let start = performance.now();
  function animate(now) {
    const elapsed = now - start;
    if (elapsed > 2500) { canvas.style.display = 'none'; return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const fadeAt = 1800;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
      p.vx *= 0.99; p.vy += 0.05;
      if (elapsed > fadeAt) p.opacity = Math.max(0, 1-(elapsed-fadeAt)/700);
      ctx.save(); ctx.globalAlpha = p.opacity; ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}

// ============ PR DETECTION ============
function detectPRs(exercises) {
  const logs = getLogs();
  const prs = [];
  exercises.forEach(ex => {
    let bestW = 0;
    logs.forEach(l => {
      const le = l.exercises.find(e => e.name === ex.name);
      if (le) le.sets.forEach(s => { if (s.weight > bestW) bestW = s.weight; });
    });
    ex.sets.forEach(s => { if (s.weight > bestW && bestW > 0) prs.push({name:ex.name,weight:s.weight,old:bestW}); });
  });
  return prs;
}

function selectTrainingPart(part) {
  if (part === '') { selectedTrainingParts = []; currentTrainingExercises = []; }
  else if (selectedTrainingParts.includes(part)) { selectedTrainingParts = selectedTrainingParts.filter(p=>p!==part); }
  else { selectedTrainingParts.push(part); }
  syncTrainingExercises();
  renderTrainingPage();
}

function syncTrainingExercises() {
  if (selectedTrainingParts.length === 0) return;
  const partSet = new Set(selectedTrainingParts);
  const existingIds = new Set(currentTrainingExercises);
  // Add exercises from selected parts that aren't already in the list
  EXERCISES.filter(e => partSet.has(e.part)).forEach(e => existingIds.add(e.id));
  // Remove exercises whose part is no longer selected
  currentTrainingExercises = [...existingIds].filter(id => {
    const ex = EXERCISES.find(e => e.id === id);
    return ex && partSet.has(ex.part);
  });
}

function addTrainingSet(exId) {
  const container = document.getElementById('sets-'+exId);
  if (!container) return;
  const idx = container.children.length + 1;
  const row = document.createElement('div');
  row.className = 'set-row';
  row.innerHTML = `
    <span class="set-num">${idx}</span>
    <input type="number" placeholder="次数" class="set-reps" value="${idx<=3?'10':''}" min="0" inputmode="numeric">
    <input type="number" placeholder="重量kg" class="set-weight" value="" min="0" step="0.5" inputmode="decimal">
    <div class="set-done" onclick="this.classList.toggle('done');startTimer()" title="完成"></div>
  `;
  container.appendChild(row);
}

function deleteExercise(exId) {
  if (!confirm('确认移除这个动作？')) return;
  currentTrainingExercises = currentTrainingExercises.filter(id => id !== exId);
  if (currentTrainingExercises.length === 0) {
    showToast('已移除最后一个动作，返回部位选择');
    selectedTrainingParts = [];
  }
  renderTrainingPage();
}

function replaceExercise(exId) {
  const currentEx = EXERCISES.find(e => e.id === exId);
  if (!currentEx) return;
  const alternatives = EXERCISES.filter(e => e.part === currentEx.part && e.id !== exId);
  if (!alternatives.length) { showToast('该部位暂无其他动作可替换'); return; }
  let html = `<p style="color:var(--text2);margin-bottom:12px">将 <strong>${currentEx.name}</strong> 替换为：</p>`;
  alternatives.forEach(e => {
    html += `<div class="card" style="padding:10px 14px;cursor:pointer;margin-bottom:8px" onclick="confirmReplaceExercise('${exId}','${e.id}')">
      <span style="font-weight:700">${e.name}</span>
      <span style="font-size:0.72rem;color:var(--text3);margin-left:6px">${e.nameEn}</span>
      <span style="font-size:0.73rem;color:var(--text2);float:right">${e.muscle}</span>
    </div>`;
  });
  showModal('🔄 替换动作', html);
}

function confirmReplaceExercise(oldId, newId) {
  const idx = currentTrainingExercises.indexOf(oldId);
  if (idx === -1) return;
  currentTrainingExercises[idx] = newId;
  closeModal();
  renderTrainingPage();
  showToast('已替换动作');
}

function addExerciseToTraining() {
  const currentParts = [...new Set(currentTrainingExercises.map(id => EXERCISES.find(e => e.id === id)).filter(Boolean).map(e => e.part))];
  let html = '<div class="section-title" style="margin-top:0">选择要添加的动作</div>';
  BODY_PARTS.forEach(part => {
    const partExercises = EXERCISES.filter(e => e.part === part && !currentTrainingExercises.includes(e.id));
    if (!partExercises.length) return;
    html += `<div style="margin-bottom:8px"><span style="font-weight:700;font-size:0.85rem;color:var(--text2)">${PART_EMOJI[part]} ${part}</span></div>`;
    partExercises.forEach(e => {

      </div>`;

}

function confirmAddExercise(exId) {
  currentTrainingExercises.push(exId);
  const e = EXERCISES.find(x => x.id === exId);
  if (e && !selectedTrainingParts.includes(e.part)) selectedTrainingParts.push(e.part);
  closeModal();
  renderTrainingPage();
  showToast('已添加 ' + (e ? e.name : '动作'));
}

function collectTrainingSets() {
  const exercises = [];
  document.querySelectorAll('[data-exercise]').forEach(card => {
    const exId = card.dataset.exercise;
    const ex = EXERCISES.find(e => e.id === exId);
    const sets = [];
    card.querySelectorAll('.set-row').forEach(row => {
      const reps = parseInt(row.querySelector('.set-reps').value) || 0;
      const weight = parseFloat(row.querySelector('.set-weight').value) || 0;
      if (reps > 0) sets.push({ reps, weight });
    });
    if (sets.length > 0) exercises.push({ name: ex.name, part: ex.part, sets });
  });
  return exercises;
}

function saveTraining() {
  const exercises = collectTrainingSets();
  if (!exercises.length) { showToast('请至少完成一组训练'); return; }

  const prs = detectPRs(exercises);
  const logs = getLogs();
  logs.push({
    date: new Date().toISOString(),
    bodyParts: [...new Set(exercises.map(e => e.part))],
    exercises,
    notes: document.getElementById('trainingNotes')?.value || '',
  });
  saveLogs(logs);
  updateStreak();
  checkAchievements(prs);

  if (prs.length > 0) { showToast(`🎉 新PR！${prs.map(p=>p.name).join('、')}`); triggerConfetti(); try{navigator.vibrate([200,100,200])}catch{} }
  else showToast('✅ 训练完成！');

  document.getElementById('trainingNotes').value = '';
  renderTrainingPage();
}

function drawExercisePlaceholder(canvas, name, muscle) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Black background
  ctx.fillStyle = '#0a0a10';
  ctx.fillRect(0, 0, w, h);

  // Subtle vignette
  const vignette = ctx.createRadialGradient(w/2, h/2, w*0.3, w/2, h/2, w*0.7);
  vignette.addColorStop(0, 'rgba(255,255,255,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);

  // Exercise name - white large text
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, w/2, h/2 - 12);

  // Target muscle - lighter below
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '14px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
  ctx.fillText(muscle, w/2, h/2 + 18);
}

const COMPOUND = new Set([

function generateAIPlan() {
  const parts = [...document.querySelectorAll('#aiParts .chip.active')].map(c => c.dataset.part);
  if (!parts.length) { showToast('请至少选择一个部位'); return; }

  const timeChip = document.querySelector('#aiTime .chip.active');
  const timeMin = parseInt(timeChip?.dataset?.time || '45');

  const energyChip = document.querySelector('#aiEnergy .chip.active');
  const energy = energyChip?.dataset?.energy || 'normal';

  // Filter exercises by selected body parts
  let pool = EXERCISES.filter(e => parts.includes(e.part));

  // De-duplicate by name (in case same exercise appears)
  const seen = new Set();
  pool = pool.filter(e => { if (seen.has(e.id)) return false; seen.add(e.id); return true; });

  // Sort: compound first, then isolation
  pool.sort((a, b) => {
    const aCompound = COMPOUND.has(a.id) ? 0 : 1;
    const bCompound = COMPOUND.has(b.id) ? 0 : 1;
    return aCompound - bCompound;
  });

  // Determine how many exercises based on time
  let count = 4;
  if (timeMin >= 90) count = 6;
  else if (timeMin >= 60) count = 5;
  else if (timeMin >= 45) count = 5;

  // Pick exercises (try to spread across parts if multiple parts selected)
  const selected = [];
  const partQuota = {};
  parts.forEach(p => partQuota[p] = 0);

  // First pass: pick one compound from each part
  for (const p of parts) {
    const ex = pool.find(e => e.part === p && COMPOUND.has(e.id) && !selected.includes(e));
    if (ex && selected.length < count) { selected.push(ex); partQuota[p]++; }
  }

  // Second pass: fill remaining slots
  for (const e of pool) {
    if (selected.length >= count) break;
    if (!selected.includes(e)) selected.push(e);
  }

  // Limit to count
  const plan = selected.slice(0, count);

  // Determine sets/reps based on time and energy
  let defaultSets = 3;
  if (timeMin >= 90) defaultSets = 4;
  else if (timeMin >= 60) defaultSets = 4;

  const repMap = { tired: [8,10], normal: [10,12], good: [12,15] };
  const [repLow, repHigh] = repMap[energy];

  // Generate sets/reps for each exercise
  aiPlan = plan.map((e, i) => {
    const isCompound = COMPOUND.has(e.id);
    const sets = isCompound ? defaultSets : Math.max(3, defaultSets - 1);
    const reps = isCompound ? `${repLow}-${repHigh}` : `${repHigh-2}-${repHigh}`;
    return { ...e, planSets: sets, planReps: reps };
  });

  // Estimate total time: each set ~45s work + 90s rest between sets
  let totalSeconds = 0;
  aiPlan.forEach(e => {
    totalSeconds += e.planSets * 45; // work time
    totalSeconds += (e.planSets - 1) * 90; // rest between sets
  });
  totalSeconds += (aiPlan.length - 1) * 120; // transition between exercises
  const estMin = Math.round(totalSeconds / 60);

  // Render result
  const resultEl = document.getElementById('aiPlanResult');
  resultEl.innerHTML = `
    <div style="border-top:1px solid var(--border);padding-top:16px">
      <div style="font-weight:700;font-size:1rem;margin-bottom:4px">📋 今日训练计划</div>
      <div style="font-size:0.78rem;color:var(--text3);margin-bottom:12px">
        ${parts.map(p=>PART_EMOJI[p]+p).join(' · ')} · ${timeMin}分钟 · 预计${estMin}分钟完成
      </div>
      ${aiPlan.map((e, i) => `
        <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start">
          <div style="font-size:1.2rem;font-weight:700;color:var(--text3);min-width:20px;text-align:center">${i+1}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:0.9rem">${e.name} <span style="font-weight:400;font-size:0.72rem;color:var(--text3)">${e.nameEn}</span></div>
            <div style="font-size:0.75rem;color:var(--text2);margin-top:2px">${e.planSets}组 × ${e.planReps}次 · ${COMPOUND.has(e.id)?'复合动作':'孤立动作'} · ${e.equip}</div>
          </div>
        </div>
      `).join('')}
      <button class="btn btn-primary mt12" onclick="startPlanTraining()">🚀 一键开始训练</button>
    </div>
  `;

  // Scroll to result
  resultEl.scrollIntoView({ behavior: 'smooth' });
}

function startPlanTraining() {
  if (!aiPlan || !aiPlan.length) return;
  selectedTrainingParts = [...new Set(aiPlan.map(e => e.part))];
  closeModal();
  switchPage('training');
  // After training page renders, pre-fill the plan data
  setTimeout(() => {
    aiPlan.forEach(e => {
      const container = document.getElementById('sets-' + e.id);
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < e.planSets; i++) {
        addTrainingSet(e.id);
      }
    });
    aiPlan = null;
  }, 200);
}

// ============ INIT ============
function init() {
  // Charts
  const ctx1 = document.getElementById('progressChart').getContext('2d');
  currentChart = new Chart(ctx1, { type:'line', data:{labels:[],datasets:[]}, options:{responsive:true,maintainAspectRatio:false} });
  const ctx2 = document.getElementById('pieChart').getContext('2d');
  currentPieChart = new Chart(ctx2, { type:'doughnut', data:{labels:[],datasets:[]}, options:{responsive:true,maintainAspectRatio:false} });

  updateStreakUI();
  renderHome();
  renderLibrary();

  // Inject PWA manifest as blob URL (single-file workaround)
  const manifestData = {
    name: '健身助手', short_name: '健身',
    description: '个人健身训练记录与动作库',
    start_url: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#FFFFFF',
    theme_color: '#FFFFFF',
    icons: [
      { src: document.querySelector('link[rel="icon"]').href, sizes: '192x192', type: 'image/png' },
      { src: document.querySelector('link[rel="icon"]').href, sizes: '512x512', type: 'image/png' }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(manifestBlob);
  document.head.appendChild(manifestLink);
}

init();
</script>
